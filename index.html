<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Смартфоны</title>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Выберите производителя</h1>
      <div class="inner">
        <div class="item">
          <img src="1.png" alt="Apple" class="img" />
          <button class="btn" id="btn1">Apple</button>
        </div>
        <div class="item">
          <img src="2.png" alt="Samsung" class="img" />
          <button class="btn" id="btn2">Samsung</button>
        </div>
        <div class="item">
          <img src="3.png" alt="Xiaomi" class="img" />
          <button class="btn" id="btn3">Xiaomi</button>
        </div>
        <div class="item">
          <img src="4.png" alt="Google" class="img" />
          <button class="btn" id="btn4">Google</button>
        </div>
      </div>
    </div>
    <div class="usercard" id="usercard"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
  </body>
</html>
